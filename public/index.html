<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Квесты — расписание смен</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1f; color: #e8e8ea;
      padding: 12px; padding-bottom: 40px; min-height: 100vh;
    }
    /* Пинкод */
    .pin-screen {
      position: fixed; inset: 0; z-index: 999; background: #1a1a1f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; transition: opacity 0.3s;
    }
    .pin-screen.hidden { opacity: 0; pointer-events: none; }
    .pin-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .pin-subtitle { font-size: 13px; color: #8a8a96; margin-bottom: 28px; text-align: center; }
    .pin-dots { display: flex; gap: 14px; margin-bottom: 32px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #2a2a32; border: 1px solid #3a3a44; transition: background 0.15s; }
    .pin-dot.filled { background: #d4a857; border-color: #d4a857; }
    .pin-dots.error { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
    .pin-btn {
      width: 72px; height: 72px; background: #23232b; color: #e8e8ea;
      border: none; border-radius: 50%; font-size: 26px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; user-select: none;
    }
    .pin-btn:active { background: #3a3a44; }
    .pin-btn.empty { visibility: hidden; }
    .pin-btn.back { font-size: 20px; color: #8a8a96; }

    /* Хедер */
    header { padding: 8px 0 16px; border-bottom: 1px solid #2a2a32; margin-bottom: 16px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 20px; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .user-badge { font-size: 12px; color: #8a8a96; background: #23232b; padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
    .user-badge.admin { color: #d4a857; border: 1px solid #d4a857; }
    .btn-add { background: #d4a857; color: #1a1a1f; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-add:active { background: #b58d3f; }
    .btn-remove { background: #3a1f1f; color: #e05a5a; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-remove:active { background: #4a2020; }
        .btn-my-shifts {
      background: #2a2a32; color: #e8e8ea; border: none;
      padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer;
    }
    .btn-my-shifts:active { background: #3a3a44; }
    .filter-tabs {
      display: flex; gap: 6px; margin-bottom: 14px;
    }
    .filter-tab {
      flex: 1; background: #23232b; color: #8a8a96; border: 1px solid transparent;
      padding: 7px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
      text-align: center;
    }
    .filter-tab:active { background: #2a2a34; }
    .filter-tab.active {
      background: #3a3a44; color: #d4a857; border-color: #d4a857;
    }
    .my-shift-item {
      background: #23232b; border-radius: 10px; padding: 12px;
      margin-bottom: 8px; cursor: pointer;
    }
    .my-shift-item:active { background: #2a2a34; }
    .my-shift-quest { color: #d4a857; font-size: 13px; margin-top: 3px; }
    .my-shift-quest.empty { color: #6a6a76; font-style: italic; }
    .my-shift-comment { color: #a88d5a; font-size: 11px; margin-top: 2px; }
    .month-label { text-align: center; font-size: 13px; color: #d4a857; letter-spacing: 0.5px; margin-bottom: 8px; }
    .week-nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; margin-bottom: 8px; }
    .week-nav button { background: #2a2a32; color: #e8e8ea; border: none; padding: 6px 12px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .week-nav button:active { background: #3a3a44; }
    .week-range { flex: 1; text-align: center; font-size: 13px; color: #8a8a96; }
    .week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-btn {
      background: #23232b; color: #8a8a96; border: 1px solid transparent;
      border-radius: 8px; padding: 8px 2px; font-size: 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .day-btn:active { background: #2a2a34; }
    .day-btn .day-name { font-size: 10px; text-transform: uppercase; opacity: 0.7; }
    .day-btn .day-num { font-size: 15px; font-weight: 600; color: #e8e8ea; }
    .day-btn.active { background: #3a3a44; border-color: #d4a857; }
    .day-btn.active .day-num { color: #d4a857; }
    .day-btn.today .day-num { color: #4caf7d; }
    .day-btn.archived .day-num { color: #6a6a76; }
    .day-btn.closed .day-num { color: #4a4a55; }

    /* Информационный баннер */
    .info-banner {
      background: #2a2a32; border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: #8a8a96; margin-top: 16px; text-align: center;
    }
    .info-banner.warn { color: #d4a857; }

    /* Локации */
    .locations { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .location h2 { font-size: 15px; color: #8a8a96; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding-left: 4px; }
    .slots { display: flex; flex-direction: column; gap: 8px; }
    .slot {
      background: #23232b; border-radius: 10px; padding: 10px 12px;
      display: flex; align-items: center; gap: 10px;
      border: 1px solid transparent; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .slot:active { background: #2a2a34; }
    .slot.booked { border-color: #d4a857; background: #2e2818; }
    .slot.mine { border-color: #4caf7d; background: #1f3327; }
    .slot.full:not(.mine) { opacity: 0.85; }

        /* Активные слоты: цвет по количеству сотрудников */
    .slot.active-slot.empty-staff {
      border-color: #e05a5a !important;
      background: #2e1a1a !important;
    }
    .slot.active-slot.one-staff {
      border-color: #e8903e !important;
      background: #2e2418 !important;
    }
    .slot.active-slot.ok-staff {
      border-color: #4caf7d !important;
      background: #1f3327 !important;
    }
    /* Архивные и закрытые — серые, всегда */
    .slot.disabled {
      opacity: 0.5;
      background: #1f1f26 !important;
      border-color: transparent !important;
      cursor: default;
    }
    .slot.disabled:active {
      background: #1f1f26 !important;
    }
    .slot.disabled .slot-quest,
    .slot.disabled .slot-quest.empty {
      color: #6a6a76 !important;
    }

        .slot-warning {
      color: #e05a5a;
      font-size: 16px;
      font-weight: 700;
      margin-left: 2px;
      vertical-align: middle;
    }

    .slot.disabled { opacity: 0.5; cursor: default; background: #1f1f26; }
    .slot.disabled:active { background: #1f1f26; }
    .slot-time { font-size: 15px; font-weight: 600; color: #fff; min-width: 48px; }
    .slot-info { flex: 1; min-width: 0; }
    .slot-quest {
      font-size: 13px; color: #d4a857; font-weight: 500; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slot-quest.empty { color: #6a6a76; font-weight: 400; font-style: italic; }
    .slot-staff { font-size: 11px; color: #8a8a96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-comment {
      font-size: 11px; color: #a88d5a; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slot-counter { font-size: 11px; color: #8a8a96; min-width: 28px; text-align: right; }
    .slot-counter.free { color: #4caf7d; }
    .slot-counter.full { color: #d4a857; }
    .slot-counter.mine { color: #4caf7d; font-weight: 600; }
    .slot-manage {
      background: #3a3a44; color: #d4a857; border: none;
      width: 26px; height: 26px; border-radius: 6px;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; padding: 0; line-height: 1;
    }
    .slot-manage:active { background: #4a4a55; }

        .slot-add-btn {
      width: 100%;
      background: #23232b;
      color: #d4a857;
      border: 1px dashed #d4a857;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .slot-add-btn:active {
      background: #2e2818;
    }
    .slot-add-plus {
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

        /* Табы локаций */
    .location-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 4px;
    }
    .location-tab {
      background: #23232b;
      color: #8a8a96;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .location-tab:active { background: #2a2a34; }
    .location-tab.active {
      background: #3a3a44;
      color: #d4a857;
      border-color: #d4a857;
    }

    .loading { text-align: center; padding: 40px 20px; color: #8a8a96; font-size: 14px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #2a2a32; color: #e8e8ea; padding: 10px 18px;
      border-radius: 10px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 100;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { border: 1px solid #e05a5a; color: #e05a5a; }

    /* Модалки */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #1f1f26; border-radius: 14px; padding: 20px;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      border: 1px solid #2a2a32;
    }
    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .modal label { display: block; font-size: 12px; color: #8a8a96; margin-bottom: 4px; margin-top: 10px; }
    .modal input, .modal select, .modal textarea {
      width: 100%; background: #23232b; color: #e8e8ea;
      border: 1px solid #2a2a32; border-radius: 8px;
      padding: 9px 11px; font-size: 14px; font-family: inherit;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: #d4a857; }
    .modal textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
    .modal-actions button { padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; font-weight: 500; }
    .btn-cancel { background: #2a2a32; color: #e8e8ea; }
    .btn-save { background: #d4a857; color: #1a1a1f; }
    .btn-save:active { background: #b58d3f; }
    .btn-danger { background: #3a1f1f; color: #e05a5a; }
    .btn-danger:active { background: #4a2020; }

    .day-group-title { font-size: 12px; color: #8a8a96; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 14px; margin-bottom: 6px; padding-left: 2px; }
    .day-group-title:first-child { margin-top: 0; }

    @media (max-width: 640px) {
      .locations { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Экран пинкода -->
  <div class="pin-screen hidden" id="pinScreen">
    <div class="pin-title">Введите пинкод</div>
    <div class="pin-subtitle">Доступ только для сотрудников</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad" id="pinPad">
      <button class="pin-btn" data-num="1">1</button>
      <button class="pin-btn" data-num="2">2</button>
      <button class="pin-btn" data-num="3">3</button>
      <button class="pin-btn" data-num="4">4</button>
      <button class="pin-btn" data-num="5">5</button>
      <button class="pin-btn" data-num="6">6</button>
      <button class="pin-btn" data-num="7">7</button>
      <button class="pin-btn" data-num="8">8</button>
      <button class="pin-btn" data-num="9">9</button>
      <button class="pin-btn empty"></button>
      <button class="pin-btn" data-num="0">0</button>
      <button class="pin-btn back" data-action="back">⌫</button>
    </div>
  </div>

  <header>
          <div class="header-actions">
        <div class="user-badge" id="userBadge">…</div>
        <button class="btn-my-shifts" id="btnMyShifts" onclick="openMyShiftsModal()">Мои слоты</button>
        <button class="btn-add" id="btnAddBooking" style="display:none" onclick="openBookingModal()">+ Бронь</button>
        <button class="btn-remove" id="btnRemoveBooking" style="display:none" onclick="openRemoveModal()">− Бронь</button>
      </div>
    </div>
    <div class="month-label" id="monthLabel">—</div>
    <div class="week-nav">
      <button onclick="changeWeek(-1)">←</button>
      <div class="week-range" id="weekRange">—</div>
      <button onclick="changeWeek(1)">→</button>
    </div>
    <div class="week-days" id="weekDays"></div>
  </header>

    <div class="location-tabs" id="locationTabs">
    <button class="location-tab active" data-loc="Свобода" onclick="setLocationTab('Свобода')">Свобода</button>
    <button class="location-tab" data-loc="Плехановская" onclick="setLocationTab('Плехановская')">Плехановская</button>
  </div>

  <div id="schedule"><div class="loading">Загрузка…</div></div>
  <div class="toast" id="toast"></div>

  <!-- Модалка: добавление брони -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal">
      <h3>Новая бронь</h3>
      <label>Локация</label>
      <select id="f_location">
        <option value="Свобода">Свобода</option>
        <option value="Плехановская">Плехановская</option>
      </select>
      <label>Дата</label>
      <input type="date" id="f_date">
      <label>Время</label>
      <select id="f_time"></select>
      <label>Квест</label>
      <select id="f_quest"></select>
      <label>Комментарий (необязательно)</label>
      <textarea id="f_comment" placeholder="Дополнительная информация"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBookingModal()">Отмена</button>
        <button class="btn-save" onclick="saveBooking()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка: список броней -->
  <div class="modal-overlay" id="removeModal">
    <div class="modal">
      <h3>Удаление броней</h3>
      <p style="font-size:13px; color:#8a8a96; margin-bottom:8px;">
        Неделя: <span id="removeWeek">—</span>
      </p>
      <div id="removeList" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRemoveModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка: управление слотом -->
  <div class="modal-overlay" id="slotModal">
    <div class="modal">
      <h3>Управление слотом</h3>
      <p style="font-size:13px; color:#8a8a96; margin-bottom:12px;">
        <span id="slotInfo">—</span>
      </p>
      <div id="slotStaffList" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSlotModal()">Закрыть</button>
      </div>
    </div>
  </div>

    <!-- Модальное окно: Мои слоты -->
  <div class="modal-overlay" id="myShiftsModal">
    <div class="modal">
      <h3>Мои слоты</h3>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all" onclick="setMyShiftsFilter('all')">Все</button>
        <button class="filter-tab" data-filter="booked" onclick="setMyShiftsFilter('booked')">С играми</button>
        <button class="filter-tab" data-filter="empty" onclick="setMyShiftsFilter('empty')">Пустые</button>
      </div>

      <div id="myShiftsList" style="display:flex; flex-direction:column; gap:8px;"></div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeMyShiftsModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // ============ ПИНКОД ============
    const APP_PIN = '2708';
    const PIN_STORAGE_KEY = 'quest_pin_ok';
    let enteredPin = '';

    function checkPin() {
      if (localStorage.getItem(PIN_STORAGE_KEY) === '1') {
        document.getElementById('pinScreen').classList.add('hidden');
        return true;
      }
      document.getElementById('pinScreen').classList.remove('hidden');
      return false;
    }

    function initPinPad() {
      const pad = document.getElementById('pinPad');
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      const dotsWrap = document.getElementById('pinDots');

      function updateDots() {
        dots.forEach((d, i) => d.classList.toggle('filled', i < enteredPin.length));
      }

      pad.addEventListener('click', (e) => {
        const btn = e.target.closest('.pin-btn');
        if (!btn) return;
        const num = btn.dataset.num;
        const action = btn.dataset.action;

        if (action === 'back') {
          enteredPin = enteredPin.slice(0, -1);
          updateDots();
          return;
        }

        if (num && enteredPin.length < 4) {
          enteredPin += num;
          updateDots();
          if (enteredPin.length === 4) {
            setTimeout(() => {
              if (enteredPin === APP_PIN) {
                localStorage.setItem(PIN_STORAGE_KEY, '1');
                document.getElementById('pinScreen').classList.add('hidden');
                if (typeof bootstrap === 'function') bootstrap();
              } else {
                dotsWrap.classList.add('error');
                setTimeout(() => {
                  dotsWrap.classList.remove('error');
                  enteredPin = '';
                  updateDots();
                }, 400);
              }
            }, 150);
          }
        }
      });
    }

    // ============ ПРИЛОЖЕНИЕ ============
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const LOCATIONS = ['Свобода', 'Плехановская'];
    const QUEST_BY_LOCATION = {
      'Свобода': ['Пиковая дама', 'Сверхъестественное'],
      'Плехановская': ['Бабадук', 'Поиграй со мной', 'Проклятье Анабель'],
    };
    const SLOT_TIMES = ['10:00','11:30','13:00','14:30','16:00','17:30','19:00','20:30','22:00'];
    const DAY_NAMES = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    let today = new Date(); today.setHours(0,0,0,0);
    let weekStart = getMonday(new Date(today));
    let selectedDate = new Date(today);
    let scheduleData = {};
    let currentUser = null;
    let activeLocation = 'Свобода';
    let bookingWindowEnd = null; // YYYY-MM-DD

    const IS_TELEGRAM = !!(tg && tg.initData);
    const DEBUG_USER_ID = 1;

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      date.setDate(date.getDate() + diff);
      date.setHours(0,0,0,0);
      return date;
    }

    function formatKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function sameDay(a, b) {
      return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }

    function showToast(text, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    function askConfirm(text) {
      return new Promise((resolve) => {
        if (IS_TELEGRAM && tg && typeof tg.showConfirm === 'function') {
          tg.showConfirm(text, (confirmed) => resolve(confirmed));
        } else {
          resolve(window.confirm(text));
        }
      });

    // Статус даты для конкретного дня
    function getDayStatus(dateKey, timeStr = null) {
      // Архив: если вся дата раньше сегодня
      const todayKey = formatKey(today);
      if (dateKey < todayKey) return 'archived';
      // Окно бронирования
      if (bookingWindowEnd && dateKey > bookingWindowEnd) return 'closed';
      return 'active';
    }

    // Статус конкретного слота
    function getSlotStatus(dateKey, timeStr) {
      const dt = new Date(`${dateKey}T${timeStr}:00`);
      if (dt < new Date()) return 'archived';
      if (bookingWindowEnd && dateKey > bookingWindowEnd) return 'closed';
      return 'active';
    }

    async function clickSlot(location, time, isMine, isFull) {
      if (!currentUser || !currentUser.id) { showToast('Авторизуйтесь в Telegram', true); return; }
      if (!isMine && isFull) { showToast('Слот заполнен (4/4)', true); return; }

      const slot_date = formatKey(selectedDate);
      const status = getSlotStatus(slot_date, time);

      if (status === 'archived') {
        showToast('Этот слот уже прошёл', true);
        return;
      }
      if (status === 'closed') {
        showToast('Бронирование на эту дату ещё не открыто', true);
        return;
      }

      // Проверка 72 часов при снятии
      if (isMine) {
        const dt = new Date(`${slot_date}T${time}:00`);
        const diffMs = dt.getTime() - Date.now();
        if (diffMs < 72 * 60 * 60 * 1000) {
          showToast('До игры меньше 72 часов. Снять вас может только админ', true);
          return;
        }
      }

      // Формируем confirm
      let confirmText;
      if (isMine) {
        confirmText = `Отказаться от слота?\n${location}, ${time}`;
      } else {
        const dt = new Date(`${slot_date}T${time}:00`);
        const diffMs = dt.getTime() - Date.now();
        if (diffMs < 72 * 60 * 60 * 1000) {
          confirmText = `До игры меньше 72 часов, снять вас сможет только админ.\n\nЗаписаться на слот?\n${location}, ${time}`;
        } else {
          confirmText = `Записаться на слот?\n${location}, ${time}`;
        }
      }

      if (!await askConfirm(confirmText)) return;

      const method = isMine ? 'DELETE' : 'POST';
      try {
        const res = await fetch('/api/shift', {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot_date, slot_time: time, location, user_id: currentUser.id }),
        });
        const json = await res.json();
        if (!json.ok) { showToast(json.error || 'Ошибка', true); return; }
        showToast(isMine ? 'Вы отписались' : 'Вы записаны');
        await loadSchedule();
        render();
      } catch (err) {
        console.error(err);
        showToast('Ошибка сети', true);
      }
    }

    function renderWeek() {
      const daysEl = document.getElementById('weekDays');
      daysEl.innerHTML = '';
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);

      // Подпись месяца
      const startMonth = weekStart.getMonth();
      const endMonth = weekEnd.getMonth();
      const startYear = weekStart.getFullYear();
      const endYear = weekEnd.getFullYear();
      let monthText;
      if (startMonth === endMonth && startYear === endYear) {
        monthText = `${MONTH_NAMES[startMonth]} ${startYear}`;
      } else if (startYear === endYear) {
        monthText = `${MONTH_NAMES[startMonth]} — ${MONTH_NAMES[endMonth]} ${startYear}`;
      } else {
        monthText = `${MONTH_NAMES[startMonth]} ${startYear} — ${MONTH_NAMES[endMonth]} ${endYear}`;
      }
      document.getElementById('monthLabel').textContent = monthText;

      document.getElementById('weekRange').textContent =
        `${weekStart.getDate()} ${MONTH_NAMES[startMonth].slice(0,3).toLowerCase()} — ${weekEnd.getDate()} ${MONTH_NAMES[endMonth].slice(0,3).toLowerCase()}`;

      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dateKey = formatKey(d);
        const dayStatus = getDayStatus(dateKey);

        const btn = document.createElement('button');
        btn.className = 'day-btn';
        if (sameDay(d, selectedDate)) btn.classList.add('active');
        if (sameDay(d, today)) btn.classList.add('today');
        if (dayStatus === 'archived') btn.classList.add('archived');
        if (dayStatus === 'closed') btn.classList.add('closed');
        btn.innerHTML = `
          <span class="day-name">${DAY_NAMES[d.getDay()]}</span>
          <span class="day-num">${d.getDate()}</span>
        `;
        btn.onclick = () => selectDay(d);
        daysEl.appendChild(btn);
      }
    }

    function renderSchedule() {
      const container = document.getElementById('schedule');
      container.innerHTML = '';
      const dateKey = formatKey(selectedDate);
      const dayData = scheduleData[dateKey] || {};
      const dayStatus = getDayStatus(dateKey);

      // Информационный баннер (если неделя закрыта)
      if (dayStatus === 'closed' && bookingWindowEnd) {
        const banner = document.createElement('div');
        banner.className = 'info-banner warn';
        const nextMon = getMonday(new Date());
        nextMon.setDate(nextMon.getDate() + 7);
        banner.textContent = `Слоты на эту неделю пока закрыты. Откроются в понедельник, ${nextMon.getDate()} ${MONTH_NAMES[nextMon.getMonth()].slice(0,3).toLowerCase()}.`;
        container.appendChild(banner);
      }

      // Обёртка — одна локация (активная)
      const locWrap = document.createElement('div');
      locWrap.className = 'locations';

      const locEl = document.createElement('div');
      locEl.className = 'location';
      const slotsEl = document.createElement('div');
      slotsEl.className = 'slots';

      SLOT_TIMES.forEach(time => {
        const key = `${activeLocation}|${time}`;
        const data = dayData[key] || { quest: null, staff: [] };
        const isBooked = !!data.quest;
        const staffCount = data.staff.length;
        const isMine = currentUser && data.staff.some(s => s.id === currentUser.id);
        const isFull = staffCount >= 4;
        const staffNames = data.staff.map(s => s.name).join(', ');
        const status = getSlotStatus(dateKey, time);
        const isDisabled = status !== 'active';

        let cls = 'slot';
        if (isDisabled) {
          cls += ' disabled';
        } else {
          cls += ' active-slot';
          if (isMine) cls += ' mine';
          else if (isBooked) cls += ' booked';
          if (isFull) cls += ' full';
          if (staffCount === 0) cls += ' empty-staff';
          else if (staffCount === 1) cls += ' one-staff';
          else cls += ' ok-staff';
        }

        const commentLine = (isBooked && data.comment)
          ? `<div class="slot-comment">${data.comment}</div>`
          : '';

        // Восклицательный знак: забронирован, но <2 сотрудников
        const warningIcon = (isBooked && staffCount < 2 && !isDisabled)
          ? '<span class="slot-warning">!</span>'
          : '';

        const slot = document.createElement('div');
        slot.className = cls;
        slot.innerHTML = `
          <div class="slot-time">${time}${warningIcon}</div>
          <div class="slot-info">
            <div class="slot-quest${isBooked ? '' : ' empty'}">${isBooked ? data.quest : 'игры нет'}</div>
            <div class="slot-staff">${staffCount > 0 ? staffNames : 'сотрудник отсутствует'}</div>
            ${commentLine}
          </div>
          <div class="slot-counter ${isMine ? 'mine' : (isFull ? 'full' : 'free')}">${staffCount}/4</div>
        `;

        // Кнопка «⋮» для админа — на всех слотах
        if (currentUser?.is_admin) {
          const manageBtn = document.createElement('button');
          manageBtn.className = 'slot-manage';
          manageBtn.textContent = '⋮';
          manageBtn.title = 'Управление сотрудниками';
          manageBtn.onclick = (e) => {
            e.stopPropagation();
            openSlotModal(activeLocation, time, data.staff || []);
          };
          slot.appendChild(manageBtn);
        }

        slot.onclick = (e) => {
          if (e.target.classList.contains('slot-manage')) return;
          if (status !== 'active') return;
          clickSlot(activeLocation, time, isMine, isFull);
        };

        slotsEl.appendChild(slot);
      });

      locEl.appendChild(slotsEl);
      locWrap.appendChild(locEl);

      container.appendChild(locWrap);
    }

    }

    function renderMyShifts() {

      if (myShiftsFilter === 'booked') filtered = myShifts.filter(s => s.quest);
      if (myShiftsFilter === 'empty') filtered = myShifts.filter(s => !s.quest);

        item.innerHTML = `
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600;">${u.name}${u.username ? ' (@' + u.username + ')' : ''}</div>
          </div>
          <button class="btn-save" style="padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer; border:none; font-weight:500;">Добавить</button>
        `;
        item.querySelector('button').onclick = () => addStaffToSlot(location, time, u.id);
        list.appendChild(item);
      });

      const backBtn = document.createElement('button');
      backBtn.className = 'btn-cancel';
      backBtn.style.cssText = 'width:100%; padding:10px; margin-top:10px;';
      backBtn.textContent = '← Назад';
      backBtn.onclick = () => openSlotModal(location, time, currentStaff);
      list.appendChild(backBtn);
    }

    // --- Сохранение: админ назначает сотрудника на слот ---
    async function addStaffToSlot(location, time, targetUserId) {
      const slot_date = formatKey(selectedDate);
      try {
        const res = await fetch('/api/shift', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slot_date, slot_time: time, location,
            user_id: targetUserId,
            admin_id: currentUser.id,
          }),
        });
        const json = await res.json();
        if (!json.ok) {
          showToast(json.error || 'Ошибка', true);
          return;
        }
        showToast('Сотрудник добавлен');
        await loadSchedule();
        render();
        closeSlotModal();
      } catch (err) {
        console.error(err);
        showToast('Ошибка сети', true);
      }
    }

    async function bootstrap() {
      await authorize();
      await loadSchedule();
      render();
    }

    initPinPad();
    if (checkPin()) bootstrap();
  </script>
</body>
</html>
